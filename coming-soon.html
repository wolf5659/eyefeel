<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyefeel – Coming soon</title>
<style>
:root{--ink:#0e0604;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--ink)}
.stage{position:relative;height:100%;min-height:360px;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink) url(assets/bg.jpg) center bottom/cover no-repeat}
.stage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 35%,rgba(14,6,4,.75) 100%),linear-gradient(to bottom,rgba(14,6,4,.55),transparent 28%,transparent 70%,rgba(14,6,4,.7))}
.sign{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;width:min(56.666vw,calc(56.666vh*1.305));height:auto;filter:drop-shadow(0 12px 40px rgba(0,0,0,.8)) drop-shadow(0 0 40px rgba(255,154,60,.25))}
@media(max-width:640px){.sign{width:min(68vw,calc(56.666vh*1.305))}}
</style></head>
<body><div class="stage"><img class="sign" src="assets/feeling-soon.webp" alt="Feeling soon"></div></body></html>
